[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "foundry-system"
version = "0.1.0"
description = "Foundry autonomous computational-systems factory"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "openai>=3.17,<4",
  "pydantic>=2.9,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
  "xai-sdk>=1.19,<2",
  "anthropic>=1,<2",
]

[dependency-groups]
dev = [
  "jsonschema>=4.23,<5",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "testcontainers[postgres]>=4.8,<5",
]

[project.scripts]
foundry = "foundry.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["foundry"]
