# Packet: P-004 — Family One: Anthropic Adapter
# One job: map each role to its model, fallback chain, and token ceiling.
# Version: 0.4.0

# Foundry Model Registry — role → model → fallback chain.
# THIS FILE IS USER CONFIGURATION. Edit freely; no packet or build required.
# Family status: Anthropic ACTIVE (P-004). OpenAI, Gemini, xAI, OpenRouter pending their packets.
# Model IDs verified against Anthropic's official docs, 2026-08-18.
# Env keys expected (via .env): ANTHROPIC_API_KEY

# Policy (R-012): minimum effort "high" on every role; thinking chairs above it.
# Revisit with meter data.

[roles.architect]
model = "anthropic/claude-opus-5"
# openai/gpt-5.6-sol: cross-family safety net (peer tier, $5/$30 — a hedge
# against an Anthropic outage, not a cost move)
fallbacks = ["anthropic/claude-sonnet-5", "openai/gpt-5.6-sol"]
max_tokens = 128000
effort = "xhigh"

[roles.architect_max]
# Escalation tier for the deepest thinking moments. Present and wired, unused
# until Cortex can request it. Fable 5: highest capability, 2x Opus 5 price.
model = "anthropic/claude-fable-5"
fallbacks = ["anthropic/claude-opus-5"]
max_tokens = 128000
effort = "max"

[roles.judge]
model = "anthropic/claude-sonnet-5"
fallbacks = ["anthropic/claude-haiku-4-5-20251001"]
# 64000, not 128000: the haiku-4-5 fallback's documented maximum is 64k,
# so a higher ceiling would turn a rescue into a second failure.
max_tokens = 64000
effort = "high"

[roles.floor_agent]
model = "anthropic/claude-haiku-4-5-20251001"
fallbacks = ["anthropic/claude-sonnet-5"]
max_tokens = 64000
effort = "high"

[roles.default]
model = "anthropic/claude-haiku-4-5-20251001"
fallbacks = []
max_tokens = 64000

[roles.judge_second]
# Cross-family judge (design doc rule: judges from different families than the architect)
model = "openai/gpt-5.6-sol"
fallbacks = ["openai/gpt-5.6-luna"]
max_tokens = 128000
effort = "high"

[roles.floor_agent_second]
# Cross-family floor tier ($2/$12). Luna ($0.20/$1.20) is cheaper and still
# runs as judge_second's fallback, but is no longer any role's primary.
model = "openai/gpt-5.6-terra"
fallbacks = []
max_tokens = 128000
effort = "high"

[roles.judge_third]
# Third-family judge — full cross-family panel per the design doc
model = "gemini/gemini-3.7-flash"
fallbacks = []
max_tokens = 64000
effort = "high"

[roles.judge_fourth]
# Fourth-family judge. Effort "high" is the xai family ceiling (R-025) — the
# intersection across Grok models, not 4.6's superset.
#
# No fallback, matching judge_third. The grok-4.1-fast fallback added earlier
# was a bad model ID and failed the live ping; xAI's own /v1/models list for
# this key offers no 4.1-fast under any spelling. Verified alternatives from
# that list, all priced, if a fallback is wanted: xai/grok-4.5 ($2/$6, 500K),
# xai/grok-4.3 ($1.25/$2.50, 1M), xai/grok-4.20-0309-reasoning ($1.25/$2.50,
# 1M). Choosing one is a role->model decision and therefore the human's.
model = "xai/grok-4.6"
fallbacks = []
max_tokens = 64000
effort = "high"
